name: Deploy OXY Video Free to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "space/**"
      - ".github/workflows/deploy-hf-space.yml"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade "huggingface_hub>=0.27"

      - name: Check HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing repository secret HF_TOKEN."
            echo "::error::Create a Hugging Face write token and add it at Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create or update Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "Almazovski/oxy-video-free"
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              private=False,
              exist_ok=True,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="space",
              commit_message="Deploy OXY Video Free from GitHub",
          )

          print(f"Deployed: https://huggingface.co/spaces/{repo_id}")
          PY
